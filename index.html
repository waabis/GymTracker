<style>
:root{
  color-scheme:light;
  --bg:#FFFFFF; --surface:#EEF2F6; --surface2:#E2E8EE; --line:#D7DEE5;
  --text:#171A1B; --muted:#5B6570; --accent:#F5A900; --accent-fg:#B45400;
  --ink:#171A1B; --danger:#DC2626; --danger-ink:#FFFFFF;
  --tab-routines:#1D4ED8; --tab-history:#15803D;
  --pad:16px; --r:14px; --r-sm:10px;
  --shadow-sm:0 1px 2px rgba(23,26,28,.05),0 3px 10px rgba(23,26,28,.06);
  --shadow-accent:0 10px 22px -8px rgba(245,169,0,.45);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);overscroll-behavior:none}
body{font-family:Archivo,system-ui,sans-serif;font-size:16px;line-height:1.45;
  font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
#app{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
#main{flex:1;padding:calc(env(safe-area-inset-top) + 12px) var(--pad) 96px}
h1{font-size:26px;font-weight:800;letter-spacing:-.02em;margin:4px 0 18px}
h2{font-size:17px;font-weight:600;margin:26px 0 10px}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--section,var(--muted));margin:0 0 8px}
.chev{color:var(--section,var(--muted));font-size:15px}
button{font-family:inherit;font-size:16px;border:0;background:none;color:inherit;cursor:pointer;
  user-select:none;-webkit-user-select:none;transition:transform .08s ease,filter .15s ease,background-color .15s ease}
input{font-family:inherit;font-size:17px;background:var(--surface2);border:1px solid var(--line);
  color:var(--text);border-radius:var(--r-sm);padding:12px;width:100%;font-variant-numeric:tabular-nums;
  transition:border-color .15s ease,box-shadow .15s ease}
input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(245,169,0,.2)}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
  background:var(--accent);color:var(--ink);font-weight:600;padding:17px;border-radius:var(--r);
  letter-spacing:.01em;box-shadow:var(--shadow-accent)}
.btn:active{filter:brightness(.94);transform:scale(.98)}
.btn.ghost{background:var(--surface);color:var(--text);border:1px solid var(--line);font-weight:500;box-shadow:none}
.btn.sm{padding:11px 16px;width:auto;font-size:15px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:16px;margin-bottom:12px;box-shadow:var(--shadow-sm);transition:transform .1s ease,box-shadow .1s ease}
button.card:active{transform:scale(.985);box-shadow:none}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.tap{width:100%;text-align:left}
.muted{color:var(--muted);font-size:14px}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:28px 20px;text-align:center;
  color:var(--muted);margin-bottom:14px;background:var(--surface)}

/* set strip: numbered like a weight stack */
.set{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.set .n{width:24px;font-size:12px;font-weight:600;color:var(--muted)}
.set .v{flex:1;font-size:20px;font-weight:800;letter-spacing:-.02em}
.set .v em{font-style:normal;font-size:12px;font-weight:500;color:var(--muted);
  letter-spacing:.08em;text-transform:uppercase;margin:0 8px 0 3px}
.set .x{color:var(--muted);font-size:22px;padding:0 6px;line-height:1}

.step{display:flex;align-items:center;gap:0;background:var(--surface2);
  border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden}
.step button{width:52px;height:52px;font-size:24px;font-weight:600;color:var(--accent-fg);flex:none}
.step button:active{background:var(--line)}
.step input{border:0;border-radius:0;background:transparent;text-align:center;
  font-size:19px;font-weight:600;padding:12px 0;min-width:0;box-shadow:none;color:var(--ink)}
.step input:focus{outline:none;box-shadow:none}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0 10px}
.lbl{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;
  color:var(--muted);margin-bottom:5px}

nav{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.85);
  backdrop-filter:blur(16px);border-top:1px solid var(--line);
  box-shadow:0 -4px 16px rgba(23,26,28,.05);
  padding-bottom:env(safe-area-inset-bottom);z-index:20}
nav div{max-width:520px;margin:6px auto;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 8px}
nav button{padding:12px 0 14px;font-size:12px;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;color:var(--muted);border-radius:12px;
  transition:background-color .15s ease,color .15s ease}
nav button.tab-train.on{color:var(--accent-fg);background:rgba(245,169,0,.18)}
nav button.tab-routines.on{color:var(--tab-routines);background:rgba(29,78,216,.14)}
nav button.tab-history.on{color:var(--tab-history);background:rgba(21,128,61,.14)}

.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.back{font-size:15px;color:var(--muted);font-weight:500}
.timer{font-size:14px;font-weight:600;color:var(--accent-fg);letter-spacing:.04em}
.fin{background:var(--accent);color:var(--ink);font-weight:600;padding:9px 16px;border-radius:var(--r-sm);
  font-size:15px;box-shadow:var(--shadow-accent)}
.danger{color:var(--danger);font-weight:500;font-size:15px}

.err{color:var(--danger);font-size:14px;font-weight:500;margin-top:8px}
.warn{background:var(--surface2);border:1px solid var(--line);border-left:3px solid var(--accent);
  border-radius:var(--r-sm);padding:12px 14px;font-size:14px;color:var(--muted);margin-bottom:18px}
.x{color:var(--muted);font-size:22px;padding:0 6px;line-height:1;background:none}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:11px 15px;border-radius:999px;background:var(--surface);border:1px solid var(--line);
  font-size:14px;font-weight:500;color:var(--text)}
.chip.on{background:var(--section,var(--accent));border-color:transparent;color:#fff;font-weight:600}
.chip:active{transform:scale(.96)}

.modal-backdrop{position:fixed;inset:0;background:rgba(23,26,28,.5);z-index:30;
  display:flex;align-items:flex-end;justify-content:center}
.modal-card{background:var(--bg);width:100%;max-width:520px;border-radius:20px 20px 0 0;
  padding:20px var(--pad) calc(env(safe-area-inset-bottom) + 24px);
  max-height:85vh;overflow-y:auto;box-shadow:0 -8px 30px rgba(23,26,28,.18)}
</style>
</head>
<body>
<div id="app"><div id="main"></div></div>
<nav><div id="tabs"></div></nav>
<div id="syncBadge" class="muted" style="position:fixed;top:calc(env(safe-area-inset-top) + 10px);right:14px;font-size:11px;z-index:21;cursor:pointer"></div>

<script>
const KEY='rack.v1';
const uid=()=>(crypto.randomUUID?crypto.randomUUID():
  'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{
    const r=Math.random()*16|0;return(c==='x'?r:(r&0x3|0x8)).toString(16);}));
let db={exercises:[],routines:[],workouts:[],active:null,syncCursor:0,seeded:false};
let view={t:'train'};
let ui={pending:null,err:null,ekey:null,nostore:false,loginOpen:false,q:'',updateReady:false,chartFor:null};
let tick=null;

/* ---------- exercise catalog ---------- */
const BODY_PARTS=['Chest','Back','Shoulders','Biceps','Triceps','Legs','Core','Cardio','Other'];
const EQUIPMENT=['Barbell','Dumbbell','Cables','Machine','Bodyweight','Other'];
const SEED=[
  ['Bench Press (Barbell)','Chest','Barbell'],
  ['Dumbbell Bench press (flat)','Chest','Dumbbell'],
  ['Dumbbell Bench press (incline)','Chest','Dumbbell'],
  ['Chest fly (Dumbbell)','Chest','Dumbbell'],
  ['Chest fly (Cable)','Chest','Cables'],
  ['Skullcrusher','Triceps','Barbell'],
  ['Overhead tricep extensions','Triceps','Dumbbell'],
  ['Barbell Rows','Back','Barbell'],
  ['Lat Pulldowns','Back','Cables'],
  ['Seated rows','Back','Cables'],
  ['Dumbbell rows','Back','Dumbbell'],
  ['Bicep curls (dumbbell)','Biceps','Dumbbell'],
  ['Hammer curls (dumbbell)','Biceps','Dumbbell'],
  ['Barbell curls','Biceps','Barbell'],
  ['Barbell curls (close grip)','Biceps','Barbell'],
  ['Squats','Legs','Barbell'],
  ['Leg press','Legs','Cables'],
  ['Leg extensions','Legs','Cables'],
  ['Lying hamstring curls','Legs','Cables'],
  ['Leg curls','Legs','Cables'],
];
const exById=id=>db.exercises.find(x=>x.id===id);
const exName=(exerciseId,fallback)=>{const e=exById(exerciseId);
  return e?e.name:(fallback||'Unknown exercise');};
const activeExercises=()=>db.exercises.filter(e=>!e.deleted);
const ROUTINE_VIEWS=['routines','routine','picker','exercises','exercise'];
/* deterministic per-routine colour: same routine always gets the same
   colour, chosen from a fixed palette so it's always vivid and readable,
   picked to stay clear of the app's own semantic colours (amber accent,
   blue Routines-section, green History-section, red danger). */
const ROUTINE_COLORS=['#7C3AED','#BE123C','#0F766E','#C2410C','#0E7490','#A21CAF','#4338CA','#854D0E'];
function routineColor(id){
  let h=0;for(let i=0;i<id.length;i++)h=(h*31+id.charCodeAt(i))>>>0;
  return ROUTINE_COLORS[h%ROUTINE_COLORS.length];
}
/* solid-fill card on a routine's colour: overriding these as custom
   properties on the card lets every existing component (muted text,
   labels, steppers, the chevron) stay legible without touching their
   own CSS -- they already all read from these same variables. */
const onColor=c=>`background:${c};--text:#fff;--muted:rgba(255,255,255,.82);`+
  `--line:rgba(255,255,255,.3);--section:rgba(255,255,255,.82)`;
const norm=s=>String(s||'').trim().toLowerCase();
const seedId=name=>'seed:'+norm(name).replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
function findOrCreateEx(name){
  const n=norm(name);
  const hit=db.exercises.find(e=>norm(e.name)===n);
  if(hit)return hit;
  const e={id:uid(),name:String(name).trim(),bodyPart:'Other',equipment:'Other',deleted:false};
  touch(e);db.exercises.push(e);return e;
}

/* ---------- sync (Phase 5) ---------- */
const SUPABASE_URL='https://ahvzifwrwnczoeoltymo.supabase.co';
const SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFodnppZndyd25jem9lb2x0eW1vIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU4Njc0NDksImV4cCI6MjEwMTQ0MzQ0OX0.QHSzoLK48QU0PGukqjGwI4KewXEofQt2qIJbaVxOyY8';
let sb=null,session=null,sync={status:'idle',err:null},syncing=false,syncTimer=null;

function load(){
  try{const r=localStorage.getItem(KEY);if(r)db=Object.assign(db,JSON.parse(r));}catch(e){ui.nostore=true;}
  if(db.syncCursor==null)db.syncCursor=0;
  if(!db.exercises)db.exercises=[];
  const migrate=x=>{if(x.updatedAt==null){x.updatedAt=Date.now();x.dirty=true;}if(x.deleted==null)x.deleted=false;};
  db.exercises.forEach(migrate);
  /* Seed the master list once; the flag stops deleted seeds coming back.
     Seed ids are derived from the name so every device generates the same id
     and they merge on sync instead of duplicating. updatedAt is 1 (not now)
     so a real edit made on another device always wins the merge. */
  if(!db.seeded){
    SEED.forEach(([name,bodyPart,equipment])=>{
      const id=seedId(name);
      if(db.exercises.some(e=>e.id===id||norm(e.name)===norm(name)))return;
      db.exercises.push({id,name,bodyPart,equipment,deleted:false,updatedAt:1,dirty:true});
    });
    db.seeded=true;
  }
  /* back-fill exerciseId on anything created before the catalog existed */
  db.routines.forEach(r=>{migrate(r);
    r.exercises.forEach(e=>{
      if(e.sets==null){e.sets=4;r.dirty=true;}
      if(!e.exerciseId){e.exerciseId=findOrCreateEx(e.name).id;touch(r);}
    });
  });
  db.workouts.forEach(w=>{migrate(w);
    w.entries.forEach(en=>{if(!en.exerciseId){en.exerciseId=findOrCreateEx(en.name).id;touch(w);}});
  });
  if(db.active)db.active.entries.forEach(en=>{
    if(!en.exerciseId)en.exerciseId=findOrCreateEx(en.name).id;});
  /* persist the migration, or auto-created exercises would get a fresh id
     on every load and pile up as duplicates once synced */
  save(false);
}
function lastEntryFor(exerciseId,fallbackName){
  const past=activeWorkouts().sort((a,b)=>b.startedAt-a.startedAt);
  for(const w of past){
    const e=w.entries.find(x=>x.exerciseId?x.exerciseId===exerciseId:norm(x.name)===norm(fallbackName));
    if(e&&e.sets.length)return e;
  }
  return null;
}
const exInUse=id=>db.routines.some(r=>!r.deleted&&r.exercises.some(e=>e.exerciseId===id))
  ||db.workouts.some(w=>!w.deleted&&w.entries.some(en=>en.exerciseId===id));
function save(sync_){try{localStorage.setItem(KEY,JSON.stringify(db));}catch(e){ui.nostore=true;}
  if(sync_!==false)scheduleSync();}
function scheduleSync(){clearTimeout(syncTimer);syncTimer=setTimeout(()=>syncNow('write'),400);}
function touch(row){row.updatedAt=Date.now();row.dirty=true;}
const activeRoutines=()=>db.routines.filter(r=>!r.deleted);
const activeWorkouts=()=>db.workouts.filter(w=>!w.deleted);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtW=w=>(Math.round(w*100)/100).toString();
function fmtDate(ms){const d=new Date(ms);return d.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});}
function dur(a,b){const m=Math.max(0,Math.round((b-a)/60000));return m<60?m+' min':Math.floor(m/60)+'h '+(m%60)+'m';}
function fmtClock(s){s=Math.max(0,Math.round(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}
function restLabel(en){
  if(!en.restEndsAt)return `Rest: ${fmtClock(en.rest||120)}`;
  const remain=(en.restEndsAt-Date.now())/1000;
  return remain>0?`Resting… ${fmtClock(remain)}`:'Rest done';
}
const restState=en=>!en.restEndsAt?'idle':(en.restEndsAt-Date.now()>0?'on':'done');
const restStyle=en=>restState(en)==='idle'?'':'font-weight:700;color:var(--text)';

/* ---------- trend charts ---------- */
/* volume = total kg moved that session; e1rm = Epley-estimated one-rep max
   (w*(1+r/30)) of the best set that session. Both are per-workout points. */
function exerciseSeries(exerciseId){
  const rows=[];
  activeWorkouts().forEach(w=>{
    const en=w.entries.find(e=>e.exerciseId===exerciseId);
    if(en&&en.sets.length)rows.push({date:w.startedAt,
      vol:en.sets.reduce((s,x)=>s+x.w*x.r,0),
      e1rm:Math.max(...en.sets.map(x=>x.w*(1+x.r/30)))});
  });
  if(db.active){
    const en=db.active.entries.find(e=>e.exerciseId===exerciseId);
    if(en&&en.sets.length)rows.push({date:db.active.startedAt,
      vol:en.sets.reduce((s,x)=>s+x.w*x.r,0),
      e1rm:Math.max(...en.sets.map(x=>x.w*(1+x.r/30)))});
  }
  return rows.sort((a,b)=>a.date-b.date);
}
function sparkline(points){
  if(!points.length)return `<div class="empty" style="padding:20px">Not enough data yet.</div>`;
  const w=280,h=130,pad=26;
  const ys=points.map(p=>p.y),xs=points.map(p=>p.x);
  const minY=Math.min(...ys),maxY=Math.max(...ys),spanY=(maxY-minY)||1;
  const minX=Math.min(...xs),maxX=Math.max(...xs),spanX=(maxX-minX)||1;
  const sx=x=>points.length===1?w/2:pad+(x-minX)/spanX*(w-2*pad);
  const sy=y=>h-pad-(y-minY)/spanY*(h-2*pad);
  const path=points.map((p,i)=>(i===0?'M':'L')+sx(p.x).toFixed(1)+','+sy(p.y).toFixed(1)).join(' ');
  const dots=points.map(p=>`<circle cx="${sx(p.x).toFixed(1)}" cy="${sy(p.y).toFixed(1)}" r="4" fill="var(--accent-fg)"/>`).join('');
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;overflow:visible">
    <line x1="${pad}" y1="${h-pad}" x2="${w-pad}" y2="${h-pad}" stroke="var(--line)"/>
    <path d="${path}" fill="none" stroke="var(--accent-fg)" stroke-width="2.5"/>
    ${dots}
    <text x="${pad}" y="14" font-size="11" fill="var(--muted)">${Math.round(maxY)}</text>
    <text x="${pad}" y="${h-8}" font-size="11" fill="var(--muted)">${fmtDate(minX)}</text>
    <text x="${w-pad}" y="${h-8}" font-size="11" fill="var(--muted)" text-anchor="end">${fmtDate(maxX)}</text>
  </svg>`;
}

function fail(k,m){ui.err=m;ui.ekey=k;render();}
function errAt(k){return ui.ekey===k&&ui.err?`<div class="err">${esc(ui.err)}</div>`:'';}
function ask(k){ui.pending=k;ui.err=null;render();}
function cancel(){ui.pending=null;render();}

/* ---------- auth ---------- */
function toggleLogin(){ui.loginOpen=!ui.loginOpen;ui.err=null;render();
  if(ui.loginOpen)setTimeout(()=>{const e=document.getElementById('loginEmail');if(e)e.focus();},30);}
function vAuthBanner(){
  if(!ui.loginOpen)return `<div class="warn" style="cursor:pointer" onclick="toggleLogin()">Not backed up &mdash; tap to log in</div>`;
  return `<div class="warn">
    <div style="font-weight:600;color:var(--text);margin-bottom:10px">Log in to back up</div>
    <input id="loginEmail" placeholder="Email" autocapitalize="off" autocomplete="email" style="margin-bottom:8px">
    <input id="loginPass" type="password" placeholder="Password" autocomplete="current-password"
      onkeydown="if(event.key==='Enter')login()">
    ${errAt('login')}
    <div style="height:10px"></div>
    <div class="row"><button class="back" onclick="toggleLogin()">Cancel</button>
    <button class="btn sm" onclick="login()">Log in</button></div>
  </div>`;
}
async function login(){
  const email=(document.getElementById('loginEmail')||{}).value||'';
  const pass=(document.getElementById('loginPass')||{}).value||'';
  if(!email.trim()||!pass){fail('login','Enter your email and password.');return;}
  if(!sb){fail('login',"Can't reach the login service right now.");return;}
  const {error}=await sb.auth.signInWithPassword({email:email.trim(),password:pass});
  if(error){fail('login',error.message||'Login failed.');return;}
  ui.loginOpen=false;ui.err=null;render();
}
async function logout(){if(sb)await sb.auth.signOut();render();}

/* ---------- views ---------- */
function render(){
  const m=document.getElementById('main');
  let html = ui.nostore?`<div class="warn">Preview mode &mdash; nothing is being saved. On your phone it will save properly.</div>`:'';
  if(ui.updateReady)html+=`<div class="warn" style="cursor:pointer;border-left-color:var(--tab-history)"
    onclick="applyUpdate()">New version ready &mdash; tap to update</div>`;
  if(!session)html+=vAuthBanner();
  if(db.active)html+=vActive();
  else if(view.t==='train')html+=vTrain();
  else if(view.t==='routines')html+=vRoutines();
  else if(view.t==='routine')html+=vRoutine();
  else if(view.t==='picker')html+=vPicker();
  else if(view.t==='exercises')html+=vExercises();
  else if(view.t==='exercise')html+=vExercise();
  else if(view.t==='history')html+=vHistory();
  html+=vChartModal();
  m.innerHTML=html;
  const sect=db.active?'train':(ROUTINE_VIEWS.includes(view.t)?'routines':view.t);
  m.style.setProperty('--section',{train:'var(--accent-fg)',
    routines:'var(--tab-routines)',history:'var(--tab-history)'}[sect]||'var(--muted)');
  document.getElementById('tabs').innerHTML=[['train','Workout'],['routines','Routines'],['history','History']]
    .map(([t,label])=>`<button class="tab-${t} ${t===sect&&!db.active||view.t===t?'on':''}" onclick="go('${t}')">${label}</button>`).join('');
  clearInterval(tick);
  if(db.active){tick=setInterval(()=>{const e=document.getElementById('timer');
    if(e)e.textContent=dur(db.active.startedAt,Date.now());
    db.active.entries.forEach((en,i)=>{const re=document.getElementById('rest-'+i);
      if(!re)return;re.textContent=restLabel(en);re.style.cssText='font-size:14px;'+restStyle(en);});
  },1000);}
  renderSyncBadge();
}
function go(t){view={t};ui.pending=null;ui.err=null;ui.ekey=null;ui.q='';render();window.scrollTo(0,0);}

/* group the catalog by body part for the picker and the manager */
function exGroups(q){
  const list=activeExercises().filter(e=>!q||norm(e.name).includes(norm(q)));
  const order=bp=>{const i=BODY_PARTS.indexOf(bp);return i<0?999:i;};
  const byBp={};
  list.forEach(e=>{const bp=e.bodyPart||'Other';(byBp[bp]=byBp[bp]||[]).push(e);});
  return Object.keys(byBp).sort((a,b)=>order(a)-order(b)||a.localeCompare(b))
    .map(bp=>[bp,byBp[bp].sort((a,b)=>a.name.localeCompare(b.name))]);
}

function closeChart(){ui.chartFor=null;render();}

function vHistory(){
  const w=activeWorkouts().sort((a,b)=>b.startedAt-a.startedAt);
  if(!w.length)return `<h1>History</h1><div class="empty">Finished workouts show up here.</div>`;
  return `<h1>History</h1>`+w.map(x=>{
    const sets=x.entries.reduce((n,e)=>n+e.sets.length,0);
    const vol=x.entries.reduce((n,e)=>n+e.sets.reduce((m,s)=>m+s.w*s.r,0),0);
    const open=view.open===x.id;
    return `<div class="card"><button class="tap" onclick="toggle('${x.id}')"><div class="row">
      <div><div style="font-weight:600">${esc(x.routineName)}</div>
      <div class="muted">${fmtDate(x.startedAt)} \u00b7 ${sets} sets \u00b7 ${Math.round(vol)} kg lifted</div></div>
      <div class="chev">${open?'&#8964;':'&rsaquo;'}</div></div></button>
      ${open?x.entries.map(e=>`<div style="margin-top:12px"><div class="lbl">${esc(exName(e.exerciseId,e.name))}</div>
        ${e.sets.map((s,j)=>`<div class="set"><div class="n">${j+1}</div>
          <div class="v">${fmtW(s.w)}<em>kg</em>${s.r}<em>reps</em></div></div>`).join('')}</div>`).join('')
        +`<div style="height:14px"></div>`+(ui.pending==='delw'+x.id
          ? `<div class="row"><button class="back" onclick="cancel()">Cancel</button>
             <button class="danger" onclick="delWorkout('${x.id}')">Tap to confirm delete</button></div>`
          : `<button class="danger" onclick="ask('delw${x.id}')">Delete this workout</button>`):''}
    </div>`;}).join('')
    +(session?`<div style="margin-top:20px"><button class="back" onclick="logout()">Log out</button></div>`:'');
}

/* ---------- actions ---------- */
function newRoutine(){const el=document.getElementById('rname');const n=(el?el.value:'').trim();
  if(!n){fail('rname','Give the routine a name first.');return;}
  const r={id:uid(),name:n,exercises:[],deleted:false};touch(r);db.routines.push(r);save();
  ui.err=null;view={t:'routine',id:r.id};render();window.scrollTo(0,0);}
function openRoutine(id){view={t:'routine',id};ui.pending=null;render();window.scrollTo(0,0);}
function delRoutine(id){const r=db.routines.find(x=>x.id===id);
  if(r){r.deleted=true;touch(r);}save();go('routines');}
function delEx(rid,eid){const r=db.routines.find(x=>x.id===rid);
  r.exercises=r.exercises.filter(e=>e.id!==eid);touch(r);save();render();}
function adjustExSets(rid,eid,d){const r=db.routines.find(x=>x.id===rid);
  const e=r.exercises.find(x=>x.id===eid);e.sets=Math.max(1,(e.sets||4)+d);touch(r);save();render();}

/* ---------- exercise catalog actions ---------- */
function openPicker(rid){view={t:'picker',id:rid};ui.q='';ui.err=null;ui.pending=null;
  render();window.scrollTo(0,0);}
/* render() replaces the DOM, so put the cursor back in the search box */
function setQ(v){ui.q=v;render();
  const el=document.getElementById('exq');
  if(el){el.focus();el.setSelectionRange(el.value.length,el.value.length);}}
function pickExercise(rid,exid){const r=db.routines.find(x=>x.id===rid);
  const cat=exById(exid);
  r.exercises.push({id:uid(),exerciseId:exid,name:cat?cat.name:'',sets:4});
  touch(r);save();view={t:'routine',id:rid};ui.q='';render();window.scrollTo(0,0);}
function newExercise(rid){const el=document.getElementById('newexname');
  const n=(el?el.value:'').trim();
  if(!n){fail('newex','Type an exercise name first.');return;}
  if(activeExercises().some(e=>norm(e.name)===norm(n))){
    fail('newex','That exercise is already in your list.');return;}
  const e=findOrCreateEx(n);save();ui.err=null;
  if(rid)pickExercise(rid,e.id);
  else{view={t:'exercises'};ui.q='';render();window.scrollTo(0,0);}}
function openExercise(id){view={t:'exercise',id};ui.pending=null;ui.err=null;
  render();window.scrollTo(0,0);}
function renameExercise(id){const el=document.getElementById('exrename');
  const n=(el?el.value:'').trim();
  if(!n){fail('exrename','Give it a name.');return;}
  if(db.exercises.some(x=>x.id!==id&&!x.deleted&&norm(x.name)===norm(n))){
    fail('exrename','Another exercise already has that name.');return;}
  const e=exById(id);e.name=n;touch(e);save();ui.err=null;render();}
function setExerciseTag(id,field,value){const e=exById(id);
  e[field]=value;touch(e);save();render();}
function delExercise(id){const e=exById(id);
  if(e){e.deleted=true;touch(e);}save();go('exercises');}

function start(rid){const r=db.routines.find(x=>x.id===rid);
  if(!r.exercises.length){fail('start','Add at least one exercise to this routine first.');return;}
  db.active={id:uid(),routineId:r.id,routineName:r.name,startedAt:Date.now(),
    entries:r.exercises.map(e=>({exerciseId:e.exerciseId,name:exName(e.exerciseId,e.name),
      sets:[],rest:120,restEndsAt:null}))};save();ui.err=null;render();window.scrollTo(0,0);}
function adjustRest(i,d){const en=db.active.entries[i];
  en.rest=Math.max(30,(en.rest||120)+d);
  if(en.restEndsAt&&en.restEndsAt>Date.now())en.restEndsAt+=d*1000;
  save(false);render();}

const nextW=en=>en.sets.length?fmtW(en.sets[en.sets.length-1].w):'20';
const nextR=en=>en.sets.length?en.sets[en.sets.length-1].r:'8';
function bump(i,f,d){const el=document.getElementById(f+i);
  let v=parseFloat(el.value)||0;v=Math.max(0,Math.round((v+d)*100)/100);el.value=fmtW(v);}
function addSet(i){const w=parseFloat(document.getElementById('w'+i).value);
  const r=parseInt(document.getElementById('r'+i).value,10);
  if(isNaN(w)||isNaN(r)||r<1){fail('set'+i,'Enter a weight and at least 1 rep.');return;}
  const en=db.active.entries[i];
  en.sets.push({w,r});
  en.restEndsAt=Date.now()+(en.rest||120)*1000;
  save();ui.err=null;render();}
function delSet(i,j){db.active.entries[i].sets.splice(j,1);save();render();}

function finish(){const a=db.active;const done=a.entries.filter(e=>e.sets.length);
  if(!done.length){ui.pending=null;fail('fin','Log at least one set before finishing.');return;}
  const w={id:a.id,routineId:a.routineId,routineName:a.routineName,
    startedAt:a.startedAt,endedAt:Date.now(),entries:done,deleted:false};
  touch(w);db.workouts.push(w);
  db.active=null;save();ui.pending=null;ui.err=null;view={t:'history',open:a.id};render();window.scrollTo(0,0);}
function cancelWorkout(){db.active=null;save(false);go('train');}
function toggle(id){view={t:'history',open:view.open===id?null:id};ui.pending=null;render();}
function delWorkout(id){const w=db.workouts.find(x=>x.id===id);
  if(w){w.deleted=true;touch(w);}save();view={t:'history'};ui.pending=null;render();}

/* ---------- sync engine ---------- */
function withTimeout(builder,ms){
  const ctrl=new AbortController();const t=setTimeout(()=>ctrl.abort(),ms||8000);
  return builder.abortSignal(ctrl.signal).then(r=>{clearTimeout(t);return r;},e=>{clearTimeout(t);throw e;});
}
const toServerExercise=(e,uidStr)=>({id:e.id,user_id:uidStr,name:e.name,body_part:e.bodyPart,
  equipment:e.equipment,deleted:!!e.deleted,updated_at:e.updatedAt});
const fromServerExercise=row=>({id:row.id,name:row.name,bodyPart:row.body_part||'Other',
  equipment:row.equipment||'Other',deleted:row.deleted,updatedAt:row.updated_at,dirty:false});
const toServerRoutine=(r,uidStr)=>({id:r.id,user_id:uidStr,name:r.name,exercises:r.exercises,
  deleted:!!r.deleted,updated_at:r.updatedAt});
const fromServerRoutine=row=>({id:row.id,name:row.name,exercises:row.exercises||[],
  deleted:row.deleted,updatedAt:row.updated_at,dirty:false});
const toServerWorkout=(w,uidStr)=>({id:w.id,user_id:uidStr,routine_id:w.routineId,routine_name:w.routineName,
  started_at:w.startedAt,ended_at:w.endedAt,entries:w.entries,deleted:!!w.deleted,updated_at:w.updatedAt});
const fromServerWorkout=row=>({id:row.id,routineId:row.routine_id,routineName:row.routine_name,
  startedAt:row.started_at,endedAt:row.ended_at,entries:row.entries||[],
  deleted:row.deleted,updatedAt:row.updated_at,dirty:false});
function mergeRow(list,incoming){
  const i=list.findIndex(x=>x.id===incoming.id);
  if(i<0)list.push(incoming);
  else if(incoming.updatedAt>list[i].updatedAt)list[i]=incoming;
}
async function pushOutbox(){
  const uidStr=session.user.id;
  const de=db.exercises.filter(e=>e.dirty),dr=db.routines.filter(r=>r.dirty),dw=db.workouts.filter(w=>w.dirty);
  /* exercises first: routines and workouts reference them */
  if(de.length){const{error}=await withTimeout(sb.from('exercises').upsert(de.map(e=>toServerExercise(e,uidStr))));
    if(error)throw error;de.forEach(e=>e.dirty=false);}
  if(dr.length){const{error}=await withTimeout(sb.from('routines').upsert(dr.map(r=>toServerRoutine(r,uidStr))));
    if(error)throw error;dr.forEach(r=>r.dirty=false);}
  if(dw.length){const{error}=await withTimeout(sb.from('workouts').upsert(dw.map(w=>toServerWorkout(w,uidStr))));
    if(error)throw error;dw.forEach(w=>w.dirty=false);}
  if(de.length||dr.length||dw.length)save(false);
}
async function pullChanges(){
  const uidStr=session.user.id;
  /* pull the catalog first so names resolve for whatever references it */
  const er=await withTimeout(sb.from('exercises').select('*').eq('user_id',uidStr).gt('updated_at',db.syncCursor));
  if(er.error)throw er.error;
  const rr=await withTimeout(sb.from('routines').select('*').eq('user_id',uidStr).gt('updated_at',db.syncCursor));
  if(rr.error)throw rr.error;
  const wr=await withTimeout(sb.from('workouts').select('*').eq('user_id',uidStr).gt('updated_at',db.syncCursor));
  if(wr.error)throw wr.error;
  let maxTs=db.syncCursor;
  er.data.forEach(row=>{const c=fromServerExercise(row);mergeRow(db.exercises,c);if(c.updatedAt>maxTs)maxTs=c.updatedAt;});
  rr.data.forEach(row=>{const c=fromServerRoutine(row);mergeRow(db.routines,c);if(c.updatedAt>maxTs)maxTs=c.updatedAt;});
  wr.data.forEach(row=>{const c=fromServerWorkout(row);mergeRow(db.workouts,c);if(c.updatedAt>maxTs)maxTs=c.updatedAt;});
  db.syncCursor=maxTs;save(false);
}
async function syncNow(trigger){
  if(!session||!sb||syncing)return;
  syncing=true;sync.status='syncing';sync.err=null;renderSyncBadge();
  try{
    /* First sync on this device pulls first: its freshly seeded catalog is
       stale by definition, and pushing it first would overwrite edits made
       on another device. After that, push first so local work goes up fast. */
    if(db.syncCursor===0){await pullChanges();await pushOutbox();}
    else{await pushOutbox();await pullChanges();}
    sync.status='idle';
    if(!db.active&&(view.t==='routines'||view.t==='history'||view.t==='train'))render();}
  catch(e){sync.status='error';sync.err=(e&&e.message)||'Sync failed';}
  syncing=false;renderSyncBadge();
}
function renderSyncBadge(){
  const el=document.getElementById('syncBadge');if(!el)return;
  if(!session||sync.status==='idle'){el.textContent='';el.onclick=null;return;}
  if(sync.status==='syncing'){el.textContent='Syncing…';el.style.color='var(--muted)';el.onclick=null;return;}
  el.textContent='Sync error — tap to retry';el.style.color='var(--danger)';el.onclick=()=>syncNow('retry');
}
function initSupabase(){
  try{
    if(window.supabase&&window.supabase.createClient){
      sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
      sb.auth.onAuthStateChange((_evt,s)=>{session=s;render();if(s)syncNow('auth');});
    }
  }catch(e){}
}
/* ---------- offline shell (Phase 2) ---------- */
let swReg=null,swReloading=false,swUpdating=false;
function applyUpdate(){
  if(swReg&&swReg.waiting){swUpdating=true;swReg.waiting.postMessage('SKIP_WAITING');}
  else location.reload();
}
function initServiceWorker(){
  if(!('serviceWorker' in navigator))return;
  /* Only reload when the user asked for the update. The first install also
     fires this (via clients.claim) and must not bounce the page. */
  navigator.serviceWorker.addEventListener('controllerchange',()=>{
    if(!swUpdating||swReloading)return;swReloading=true;location.reload();
  });
  navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'}).then(reg=>{
    swReg=reg;
    /* An existing controller means this is an update, not the first install —
       only then is there something for the user to apply. */
    if(reg.waiting&&navigator.serviceWorker.controller){ui.updateReady=true;render();}
    reg.addEventListener('updatefound',()=>{
      const nw=reg.installing;if(!nw)return;
      nw.addEventListener('statechange',()=>{
        if(nw.state==='installed'&&navigator.serviceWorker.controller){ui.updateReady=true;render();}
      });
    });
  }).catch(()=>{});
}

window.addEventListener('online',()=>syncNow('online'));
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState!=='visible')return;
  syncNow('foreground');
  if(swReg)swReg.update().catch(()=>{});
});

load();
try{localStorage.setItem(KEY+'.t','1');localStorage.removeItem(KEY+'.t');}catch(e){ui.nostore=true;}
render();
initSupabase();
initServiceWorker();
</script>
